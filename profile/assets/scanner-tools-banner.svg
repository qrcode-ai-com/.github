<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">QR Code AI — QR code and barcode scanning</title>
  <desc id="description">A dark brand banner with blue scan-frame corners and a coral scanning line. QR Code Scanner and Barcode Scanner are identified as scanning products in development for people and developers.</desc>
  <defs>
    <style>
      :root {
        --canvas: #0A0A0F;
        --surface: #111725;
        --ink: #F5F7FF;
        --muted: #B5C3D9;
        --brand: #005EFF;
        --brand-light: #79AAFF;
        --accent: #F65428;
        --border: #29364D;
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .ink { fill: var(--ink); }
      .muted { fill: var(--muted); }
      .brand-light { fill: var(--brand-light); }
      .border { stroke: var(--border); }
      .brand-stroke { stroke: var(--brand); }
    </style>
    <linearGradient id="panel" x1="810" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#005EFF" stop-opacity="0.18" />
      <stop offset="1" stop-color="#005EFF" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="var(--canvas)" />
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" class="border" />
  <path d="M804 1H1176C1188.7 1 1199 11.3 1199 24V336C1199 348.7 1188.7 359 1176 359H804V1Z" fill="url(#panel)" />
  <path d="M804 32V328" class="border" />

  <rect x="48" y="42" width="4" height="18" rx="2" fill="var(--accent)" />
  <text x="64" y="56" class="muted" font-size="13" font-weight="600" letter-spacing="1.5">SCANNING PRODUCTS IN DEVELOPMENT</text>
  <text x="48" y="126" class="ink" font-size="48" font-weight="650" letter-spacing="-1.5">QR Code AI</text>
  <text x="48" y="177" class="ink" font-size="30" font-weight="550" letter-spacing="-0.6">QR code &amp; barcode scanning</text>
  <text x="48" y="213" class="muted" font-size="20" font-weight="400">For people and developers.</text>

  <rect x="48" y="258" width="202" height="44" rx="10" fill="var(--surface)" class="border" />
  <circle cx="69" cy="280" r="4" fill="var(--brand-light)" />
  <text x="83" y="286" class="ink" font-size="16" font-weight="500">QR Code Scanner</text>
  <rect x="264" y="258" width="204" height="44" rx="10" fill="var(--surface)" class="border" />
  <circle cx="285" cy="280" r="4" fill="var(--brand-light)" />
  <text x="299" y="286" class="ink" font-size="16" font-weight="500">Barcode Scanner</text>
  <text x="747" y="286" text-anchor="end" class="brand-light" font-size="15" font-weight="500">qrcode-ai.com</text>

  <g stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="brand-stroke">
    <path d="M871 120V91H900" />
    <path d="M1103 120V91H1074" />
    <path d="M871 240V269H900" />
    <path d="M1103 240V269H1074" />
  </g>
  <path d="M854 180H1120" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" />
  <path d="M895 145H1079M895 215H1079" class="border" stroke-width="2" stroke-linecap="round" />
  <text x="987" y="160" text-anchor="middle" class="muted" font-size="16" font-weight="500" letter-spacing="2">SCAN</text>
  <text x="987" y="208" text-anchor="middle" class="ink" font-size="16" font-weight="500" letter-spacing="2">DECODE</text>
</svg>
